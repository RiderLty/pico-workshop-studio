name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build prebuilt dist
        run: ./deploy/build-dist.sh

      - name: Package dist
        run: |
          tar -C deploy/dist -czf pico-workshop-studio-dist.tar.gz .
          sha256sum pico-workshop-studio-dist.tar.gz > pico-workshop-studio-dist.tar.gz.sha256

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR 路径必须小写；仓库 owner 是 RiderLty，镜像路径用 riderlty
          images: ghcr.io/riderlty/pico-workshop-studio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        # 包默认可能是 private；这一步失败不影响镜像本身，可在 GitHub Packages 页面手动改为 public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /user/packages/container/pico-workshop-studio -f visibility=public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pico-workshop-studio-dist.tar.gz
            pico-workshop-studio-dist.tar.gz.sha256
          body: |
            Docker 镜像：

            ```
            ghcr.io/riderlty/pico-workshop-studio:${{ github.ref_name }}
            ghcr.io/riderlty/pico-workshop-studio:latest
            ```

            预构建产物：`pico-workshop-studio-dist.tar.gz`（含 `web/dist`、`server`、生产依赖与 runtime Dockerfile）。
