services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: pico-workshop-studio:latest
    container_name: pico-workshop-studio
    restart: unless-stopped
    init: true

    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data

    volumes:
      - ./data:/data

    mem_limit: 256m
    memswap_limit: 256m

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||27193)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
