# workshop.rd5isto.top — Pico 工坊工作室（后端 127.0.0.1:27193）
# 安装位置：/root/appdata/nginx/conf.d/workshop.rd5isto.top.conf
# 证书：/root/appdata/nginx/certs/rd5isto.top/（通配符 *.rd5isto.top）

server {
    listen 80;
    listen [::]:80;
    server_name workshop.rd5isto.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workshop.rd5isto.top;

    ssl_certificate     /etc/nginx/certs/rd5isto.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/rd5isto.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/workshop.access.log;
    client_max_body_size 40m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:27193;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
