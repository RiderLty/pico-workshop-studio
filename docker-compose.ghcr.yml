# 拉取 GitHub Actions 构建好的镜像运行；VPS 不需要源码、npm、Vite。
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 国内/加速：在 .env 里设 STUDIO_IMAGE=ghcr.nju.edu.cn/riderlty/pico-workshop-studio:latest
# .env 与 docker-compose.yml 共用（PUBLIC_BASE_URL / HOST / PORT / ADMIN_* / SESSION_SECRET）。
services:
  studio:
    image: ${STUDIO_IMAGE:-ghcr.io/riderlty/pico-workshop-studio:latest}
    container_name: pico-workshop-studio
    restart: unless-stopped
    init: true

    network_mode: host
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data

    volumes:
      - ./data:/data

    mem_limit: 256m
    memswap_limit: 256m

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
